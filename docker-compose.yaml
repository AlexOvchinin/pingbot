services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: pingbot-app
    restart: unless-stopped
    env_file:
      - /hot/apps/pingbot/.env
    environment:
      - TZ=UTC
    volumes:
      - /hot/apps/pingbot/data:/home/appuser/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
